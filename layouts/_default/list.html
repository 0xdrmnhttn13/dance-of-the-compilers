{{ define "main" }}
<section>
  <h2>{{ .Title }}</h2>
  <div class="post-list">
  {{ range .Pages }}
    <article>
      <time>{{ .Date.Format "2006-01-02" }}</time>
      <div><a href="{{ .RelPermalink }}">{{ .Title }}</a><p>{{ .Description }}</p></div>
    </article>
  {{ end }}
  </div>
</section>
{{ end }}
